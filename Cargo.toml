[package]
name = "project-manager"
version = "0.1.0"
edition = "2024"
description = "Native GPUI workbench for local projects"
license = "MIT"
repository = "https://github.com/StephenPudding/project-manager"
publish = false

[[bin]]
name = "project-manager"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = "0.3"
regex = "1"
sha2 = "0.10"
mime_guess = "2"
percent-encoding = "2"
anyhow = "1"
async-channel = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
url = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
opt-level = 3
strip = true
